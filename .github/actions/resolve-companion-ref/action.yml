## AI-Assisted

name: 'Resolve companion ref'
description: >-
  Decide which ref of a companion repo (dist-ai, helper-scripts, ...) to check
  out: this commit when the companion IS the repo under test, a same-named
  companion branch when one exists, else master. See resolve-companion-ref.sh
  for why. 'repo' selects the companion; it defaults to dist-ai for back-compat.

inputs:
  repo:
    description: 'owner/repo of the companion repository to resolve a ref for.'
    required: false
    default: 'org-ai-assisted/dist-ai'

outputs:
  ref:
    description: 'The companion ref to check out.'
    value: ${{ steps.resolve.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Resolve companion ref
      id: resolve
      shell: bash
      ## github.head_ref is set on pull_request only; ref_name covers push
      ## and workflow_dispatch. Routed through env: rather than inlined
      ## into run:, per the script-injection rule in
      ## agents/github-actions-security.md -- head_ref is attacker-named
      ## on a fork PR.
      env:
        THIS_REPO: ${{ github.repository }}
        THIS_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        ## TODO: Rename this environment variable.
        COMPANION_REPO: ${{ inputs.repo }}
      ## $GITHUB_ACTION_PATH is runtime-resolved, so this works both
      ## in-repo and when GitHub downloads the action for a consumer.
      run: "$GITHUB_ACTION_PATH/resolve-companion-ref.sh"
