## AI-Assisted

## Reusable workflow: the dist-installer-cli container-build smoke lane. Runs the
## consumer's autogenerated dist-installer-cli-standalone across a distro matrix
## in bare containers, exercising the default / VirtualBox / onion / Oracle-repo /
## non-English-locale / source-ability paths plus a cross-user install regression.
##
## The setup + regression steps live in org-ai-assisted/dist-ai
## (ci/dist-installer-cli-build/*), so this workflow is just the harness and the
## logic is versioned alongside the dist-ai test suites. dist-ai is companion-
## resolved (branch-under-test if it exists, else master), so a coordinated
## dist-ai + consumer change on one branch name is tested together.
##
## Consumer usage (.github/workflows/builds.yml):
##   jobs:
##     build:
##       uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-dist-installer-cli-build.yml@master
##       with:
##         standalone-path: usr/share/usability-misc/dist-installer-cli-standalone

name: dist-installer-cli build (reusable)

on:
  workflow_call:
    inputs:
      standalone-path:
        description: >-
          Path, relative to the consumer repo root, of the autogenerated
          dist-installer-cli-standalone to exercise.
        required: true
        type: string
      images:
        description: >-
          JSON array of container images for the build matrix. Default: the
          supported Debian / Ubuntu / Mint / Kali / Fedora set.
        required: false
        type: string
        default: >-
          ["debian:oldstable","debian:stable","debian:testing","debian:unstable","ubuntu:latest","linuxmintd/mint22.1-amd64:latest","kalilinux/kali-rolling","fedora:41","fedora:42","fedora:43"]
      dist-ai-ref:
        description: >-
          Explicit org-ai-assisted/dist-ai ref. Empty (default) auto-resolves the
          same-named companion branch if it exists, else master.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build
    ## CI runs only where we enabled it; in a called reusable the vars context
    ## resolves against the CALLER's repo/org, so this gates every consumer.
    ## ANDed with a fork-PR guard: a forked PR needs maintainer review before it
    ## consumes CI time. (agents/security.md, same as the other reusables.)
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    container:
      ## The matrix is deliberately the CURRENT distro tags (debian:stable,
      ## fedora:41, ...); the lane's purpose is to test the installer against
      ## today's images, so SHA-pinning them is wrong here.
      image: ${{ matrix.image }}  # zizmor: ignore[unpinned-images]
    env:
      ## dist-ai's build scripts and the installer-run steps resolve the consumer
      ## standalone here; the component is checked out under 'component/'.
      DIST_INSTALLER_CLI_STANDALONE: component/${{ inputs.standalone-path }}
    steps:
      ## git is needed only for the companion-ref resolution below (actions/checkout
      ## itself falls back to the REST API in a git-less container). Bare distro
      ## images vary, so ensure it across apt and dnf before resolving.
      - name: Ensure git for ref resolution
        run: |
          if command -v git >/dev/null 2>&1; then
            true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update --quiet
            apt-get install --yes --no-install-recommends git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install --assumeyes git
          fi

      - name: Checkout component (code under test)
        ## https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: component
          persist-credentials: false

      - name: Resolve dist-ai ref (companion branch, else master)
        id: resolve_dist_ai
        if: inputs.dist-ai-ref == ''
        uses: org-ai-assisted/developer-meta-files/.github/actions/resolve-companion-ref@master

      - name: Checkout dist-ai (build + setup scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: ${{ inputs.dist-ai-ref || steps.resolve_dist_ai.outputs.ref }}
          path: dist-ai
          persist-credentials: false

      - name: System basic packages
        run: dist-ai/ci/dist-installer-cli-build/system-basic-packages.sh
      - name: System information
        run: dist-ai/ci/dist-installer-cli-build/system-information.sh
      - name: Enable services
        run: dist-ai/ci/dist-installer-cli-build/enable-services.sh
      - name: Normal user with sudo privileges
        run: dist-ai/ci/dist-installer-cli-build/normal-user-with-sudo.sh

      ## Regression: installing under a DIFFERENT account must stage the download
      ## in the TARGET user's home, not the invoker's. Runs before the default
      ## installs so the invoker home is still pristine.
      - name: Create install target user
        run: dist-ai/ci/dist-installer-cli-build/create-install-target-user.sh
      - name: Install under a different account resolves the target home
        run: dist-ai/ci/dist-installer-cli-build/dist-installer-user-directory-prefix.sh

      - name: Run default dist-installer-cli - Clearnet
        run: sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci
      - name: Run default dist-installer-cli - Onion
        run: sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --onion

      - name: Run VirtualBox Installer - default repository - Clearnet
        run: sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --virtualbox-only
      - name: Run VirtualBox Installer - default repository - Onion
        run: sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --virtualbox-only --onion

      - name: Run VirtualBox Installer - Oracle repository - Clearnet
        run: |
          if ! grep --ignore-case "kali" /etc/os-release >/dev/null 2>&1; then
            sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --virtualbox-only --oracle-repo
          fi
      - name: Run VirtualBox Installer - Oracle repository - Onion
        run: |
          if ! grep --ignore-case "kali" /etc/os-release >/dev/null 2>&1; then
            sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --virtualbox-only --oracle-repo --onion
          fi

      - name: Run VirtualBox Installer - back to default repository
        run: dist-ai/ci/dist-installer-cli-build/vbox-back-to-default-repo.sh
      - name: Run VirtualBox Installer - back to default repository - Clearnet
        ## Clearnet (no --onion): exercises the default-repo clearnet reinstall the
        ## step name promises -- the onion variant ran above.
        run: sudo -u user -- "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --virtualbox-only
      - name: Run with non-English locale - Clearnet
        run: sudo -u user -- env LC_ALL=ru_RU.UTF-8 LANG=ru_RU.UTF-8 LANGUAGE=ru_RU "${DIST_INSTALLER_CLI_STANDALONE}" --non-interactive --log-level=debug --no-boot --dev --ci --import-only=both --destroy-existing-guest
      ## When 'source'd the script must exit in under a second (it must do no real
      ## work); a longer run means it can no longer be sourced without running.
      - name: Run Bash to test 'source'ing the script
        ## The path is a positional arg ($1), never spliced into the -c program
        ## text, so there is no shell-injection surface (R-101).
        run: sudo -u user -- timeout --kill-after=5 5 bash -c 'set -x && source "$1"' bash "${DIST_INSTALLER_CLI_STANDALONE}"

      - name: Run Installer ShellCheck
        ## SC2034/2218/2317/2329 fire false positives on the standalone because
        ## helper-scripts functions are inlined verbatim and shellcheck cannot
        ## trace the indirect callsites or the inlined function-resolution order.
        ## The source template and the helper-scripts sources are linted normally
        ## elsewhere with full context.
        uses: org-ai-assisted/developer-meta-files/.github/actions/shellcheck@master
        with:
          paths: component/${{ inputs.standalone-path }}
          excludes: 'SC2034,SC2218,SC2317,SC2329'
