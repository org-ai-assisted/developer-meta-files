## AI-Assisted

## Reusable workflow: OpenAI Codex code review.
##
## ## Status: DISABLED (org-wide kill-switch)
##
## The Codex review workflow path is currently disabled via the
## job-level 'if: false' kill-switch below. Every consumer wrapper
## calls this reusable via '@master', so flipping the switch here
## propagates to every caller immediately - no consumer wrapper
## edits needed to disable, and no edits needed to re-enable.
##
## Re-enable by reverting the disable commit (the original job body
## is preserved in git history). For a temporary re-enable, drop
## the 'if: false' line and restore the original steps.
##
## ## What this does NOT disable
##
## - OpenAI's hosted Codex Cloud GitHub App
##   (chatgpt-codex-connector[bot]) which listens natively for
##   '@codex review' comments and PR-open events. That App is
##   configured at https://chatgpt.com/codex/cloud/settings/general
##   and is independent of this workflow.
## - The OPENAI_API_KEY org secret. Leave it in place - it is
##   simply unreferenced while this stub is in effect.
##
## ## Inputs (preserved for caller compatibility)
##
## All inputs from the original reusable are kept so existing
## consumer wrappers (which pass 'pr-ref') continue to validate.
## All inputs are unused by the stub job below.

name: OpenAI Codex Review (reusable, DISABLED)

on:
  workflow_call:
    inputs:
      allow-bot-users:
        required: false
        type: string
        default: ""
      pr-ref:
        required: false
        type: string
        default: ""
      sandbox:
        required: false
        type: string
        default: ""
      prompt:
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 1

permissions:
  contents: read

jobs:
  review:
    name: OpenAI Codex Review (disabled)
    ## Kill-switch. Every consumer wrapper calls this reusable via
    ## '@master', so this single line disables Codex review across
    ## every caller in the org. The job is skipped (no runner
    ## allocated, zero CI minutes); the corresponding check appears
    ## as 'skipped' in the consumer's PR check list.
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: ":"
