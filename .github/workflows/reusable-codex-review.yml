## AI-Assisted

## Reusable workflow: OpenAI Codex code review on pull requests,
## with a workflow_dispatch override path for fork PRs and a
## comment-trigger path for '@codex review' from a roster actor.
##
## ## Trust footprint
##
## openai/codex-action - SHA-pinned, calls the OpenAI API with the
## caller's OPENAI_API_KEY. Posts review comments via the runner's
## GITHUB_TOKEN scoped to the permissions block on the calling job.
##
## Note: this workflow path runs alongside OpenAI's hosted Codex
## Cloud GitHub App (chatgpt-codex-connector[bot]) which natively
## listens for '@codex review' comments. Both will respond on a
## comment trigger - the workflow path here is kept for parity
## with the Claude reusable's '@claude' mention path and to keep
## review compute under the org's control where desired.
##
## ## Fork-PR safety
##
## On 'pull_request' events the job hard-skips fork PRs so
## attacker-controlled prompts/code cannot burn the paid OPENAI_API_KEY.
## Same skip applies on comment-triggered runs (the resolve step
## errors out if the PR head repo doesn't match the caller). To
## review a fork PR after maintainer triage, use the caller's
## workflow_dispatch path with a 'pr_ref' input - workflow_dispatch
## bypasses the fork skip (implicitly maintainer-authorized).
##
## ## Caller responsibilities
##
## - Define triggers. Schedule cannot live in workflow_call per G-A-002.
##   Recommended trigger surface (matches Claude reusable):
##     - pull_request
##     - issue_comment (types: [created])
##     - pull_request_review_comment (types: [created])
##     - workflow_dispatch with pr_ref input
## - Hardcode the owner in 'jobs.<id>.uses:' (G-A-001).
## - Forward secrets via 'secrets: inherit' on the calling job.
##   The reusable reads 'secrets.OPENAI_API_KEY' directly from the
##   caller's secret namespace.
## - Grant the job-level permissions block listed in the caller
##   example below.
##
## ## Inputs
##
## - allow-bot-users   (optional)  Comma-separated bot usernames
##                                 to bypass the action's actor-
##                                 write-access gate. Strictly
##                                 narrower than granting write.
##                                 Doubles as the @codex-review
##                                 comment-trigger roster (humans
##                                 in this list are also allowed
##                                 to invoke via comment).
##                                 Default: the org's canonical bot
##                                 list (set inline below).
## - pr-ref            (optional)  Ref to checkout (workflow_dispatch
##                                 fork-PR review path). Use
##                                 'refs/pull/<N>/merge' (most
##                                 accurate) or 'refs/pull/<N>/head'.
##                                 Default: "" (use github.ref).
## - sandbox           (optional)  Codex sandbox mode. Default
##                                 'read-only' - the action runs
##                                 review-only, no workspace
##                                 mutation.
## - prompt            (optional)  Instruction passed to Codex.
##                                 Default: a generic
##                                 security/correctness/best-practices
##                                 review prompt.
## - timeout-minutes   (optional)  Job timeout. Default 30.
##
## ## Secrets
##
## Read from the caller's secret namespace via 'secrets: inherit':
##
## - OPENAI_API_KEY  (required)  OpenAI API key. Set at org level;
##                               every consumer in the org gets it
##                               for free.
##
## ## Caller example
##
##   name: OpenAI Codex Review
##   on:
##     pull_request:
##     issue_comment:
##       types: [created]
##     pull_request_review_comment:
##       types: [created]
##     workflow_dispatch:
##       inputs:
##         pr_ref:
##           description: "refs/pull/<N>/merge or refs/pull/<N>/head"
##           required: true
##           type: string
##   permissions:
##     contents: read
##   jobs:
##     review:
##       uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-codex-review.yml@master
##       with:
##         pr-ref: ${{ inputs.pr_ref || '' }}
##       secrets: inherit
##       permissions:
##         contents: read
##         pull-requests: write

name: OpenAI Codex Review (reusable)

on:
  workflow_call:
    inputs:
      allow-bot-users:
        required: false
        type: string
        default: "adrelanos,ArrayBolt3,assisted-by-ai"
      pr-ref:
        required: false
        type: string
        default: ""
      sandbox:
        required: false
        type: string
        default: "read-only"
      prompt:
        required: false
        type: string
        default: "Review the code changes in this PR for security, correctness, and best practices."
      timeout-minutes:
        required: false
        type: number
        default: 30
    ## Secrets schema intentionally not declared. Callers pass
    ## 'secrets: inherit' and the action below reads
    ## 'secrets.OPENAI_API_KEY' from the caller's namespace
    ## directly. Tighten via explicit map + schema declaration as a
    ## follow-up - same hardening pattern as the Claude review
    ## reusable's recent change.

permissions:
  contents: read

## Concurrency key includes the PR/issue number so different PRs
## don't share a group on issue_comment events (which run on the
## default branch ref, not the PR head ref).
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-ref || github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenAI Codex Review
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    ## Trigger surface:
    ##   workflow_dispatch  - always allowed (maintainer-authorized).
    ##   pull_request       - only same-repo PRs (fork skip; fork
    ##                        review goes via workflow_dispatch).
    ##   issue_comment / pull_request_review_comment - only when
    ##                        the comment body contains '@codex
    ##                        review' AND the actor is in the
    ##                        roster (allow-bot-users). The
    ##                        comment-triggered run also fork-skips
    ##                        in the resolve step below.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (
        contains(format(',{0},', inputs.allow-bot-users), format(',{0},', github.actor)) &&
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@codex review')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex review'))
        )
      )

    permissions:
      contents: read
      pull-requests: write

    steps:
      ## Comment-triggered path: resolve the PR head SHA via the
      ## REST API (github.ref on issue_comment is the default
      ## branch, not the PR head). Hard-fail on fork PRs - same
      ## security stance as the pull_request fork skip in the
      ## job-level if: above.
      - name: Resolve PR head (comment-triggered)
        id: resolve_pr
        if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            issue_comment)
              pr_url="${{ github.event.issue.pull_request.url }}"
              ;;
            pull_request_review_comment)
              pr_url="${{ github.event.pull_request.url }}"
              ;;
          esac
          if [ -z "$pr_url" ]; then
            echo "::error::Could not resolve PR URL from ${{ github.event_name }} event"
            exit 1
          fi
          json="$(gh api "$pr_url")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$json")"
          head_sha="$(jq -r '.head.sha' <<<"$json")"
          if [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "::error::PR is from fork '$head_repo'. Use workflow_dispatch with pr_ref to review fork PRs."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ## Three checkout cases:
          ##   comment-triggered  -> resolved PR head SHA
          ##   workflow_dispatch  -> caller-supplied pr-ref
          ##   pull_request       -> default github.ref (PR head)
          ref: ${{ steps.resolve_pr.outputs.head_sha || inputs.pr-ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Run Codex Review
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1  # main @ 2026-05-06 (no stable tag yet)
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ inputs.allow-bot-users }}
          sandbox: ${{ inputs.sandbox }}
          prompt: ${{ inputs.prompt }}
