## AI-Assisted

## Reusable workflow: bandit security-focused Python static analysis.
##
## Free open-source local-runnable alternative to the Python side
## of Coverity Scan. Complements pyflakes / pylint (those focus on
## correctness / style) by surfacing security-relevant patterns:
## hardcoded passwords, shell=True subprocess, weak crypto, eval(),
## etc.
##
## ## Trust footprint
##
## bandit is published by PyCQA and packaged in the Debian / Ubuntu
## archive; apt-installed by name. No GitHub Marketplace action
## used.
##
## ## Python discovery
##
## bandit's stock discovery is by '.py' extension. This org names
## many Python sources without a '.py' extension (Debian-libexec
## convention, genmkfile package-tag naming '*.py#tag'); a stock
## bandit invocation would silently miss them. The reusable
## therefore discovers Python files by `.py` extension PLUS first-
## line shebang `^#!.*python` via
## ci/bandit-discover-python.sh, and feeds the explicit file list
## to bandit. See agents/github-actions-consumer-templates.md
## "Parameter ownership across reusable inputs" for the broader
## bandit-as-universal-template rationale.
##
## ## No per-repo configuration
##
## bandit is a universal consumer template - no
## .github/dm-consumer.yml section needed. severity-level,
## confidence-level, and timeout-minutes are hardcoded here at
## the previous defaults (medium / medium / 10 min). No
## workflow-side skips: the fleet-wide B303,B324 weak-hash pair
## is GATED (blocking); non-security digests are waived per-site
## with bandit's `# nosec` inline comment (see the `bandit` step;
## the apt bandit 1.6.2 version-skew is why B324's internal-error
## noise is waived, not a per-repo choice). A per-repo REAL false
## positive uses the same `# nosec` mechanism. If a real use case for
## per-repo skip lists appears during migration, promote
## `bandit.skips` to dm-consumer.yml at that point (see spec
## parameter table).
##
## ## Caller responsibilities
##
## - Define the trigger schedule. Schedule cannot live in
##   workflow_call per G-A-002.
## - Hardcode the owner in 'jobs.<id>.uses:' (G-A-001).
##
## ## Caller example - byte-identical consumer wrapper
##
##   name: bandit
##   on:
##     push:
##       branches: [master]
##     pull_request:
##       branches: [master]
##     workflow_dispatch:
##   permissions:
##     contents: read
##   jobs:
##     bandit:
##       uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-bandit.yml@ai
##       permissions:
##         contents: read
##
## Note: no 'with:' block on the reusable call. Per-repo state is
## not used.

name: bandit (reusable)

on:
  workflow_call:

permissions:
  contents: read

## No 'concurrency:' block - see agents/github-actions.md G-A-006.

jobs:
  bandit:
    name: bandit
    ## Pinned to ubuntu-24.04 for consistency with the other
    ## parameterized reusables.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    ## CI runs only where we enabled it. In a CALLED reusable the vars
    ## context resolves against the CALLER's repository and org, so this
    ## one condition gates every consumer -- upstream and forks skip with
    ## no runner allocated and the run stays green, rather than taking a
    ## red X for a lane they never opted into. A fork that WANTS the lane
    ## sets the same variable in its own repo; no patch to our files.
    ##
    ## ANDed with the fork-PR guard, which stays.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || !startsWith(github.event_name, 'pull_request'))

    permissions:
      contents: read

    env:
      DIST_AI_REF: ${{ github.repository == 'org-ai-assisted/dist-ai' && github.sha || 'master' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout dist-ai (shared CI helper binaries)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: ${{ env.DIST_AI_REF }}
          path: .github/dist-ai
          persist-credentials: false

      - name: Install bandit
        uses: org-ai-assisted/developer-meta-files/.github/actions/apt-install-with-cache@master
        with:
          packages: 'bandit'
          cache-key: ${{ runner.os }}-apt-bandit-${{ hashFiles('.github/workflows/reusable-bandit.yml') }}

      - name: bandit
        ## Shebang-aware discovery via dmf helper. Feeds explicit
        ## NUL-separated file list to bandit via xargs -0.
        ##
        ## -ll  severity threshold >= medium
        ## -ii  confidence threshold >= medium
        ## B303 (md4/md5/sha1 calls) and B324 (hashlib.new insecure algo)
        ##      GATE weak hashing fleet-wide: hashlib.sha1(password) and
        ##      hashlib.new("md5", data) FAIL this lane. COVERAGE GAP on
        ##      1.6.2: B324 matches only md4/md5, so hashlib.new("sha1" /
        ##      "sha", ...) is NOT caught (sha1 added to B324 in 1.6.3); a
        ##      direct hashlib.sha1() still is, via B303.
        ##      apt-pinned bandit (Ubuntu noble ships 1.6.2, kept for the
        ##      Debian-vetted supply chain) ignores usedforsecurity=False,
        ##      so a legitimate NON-security digest
        ##      (hashlib.sha1(..., usedforsecurity=False) for RFC 4122 v5
        ##      UUIDs / reproducible-build manifest hashes) is waived at
        ##      the call site with an inline `# nosec B303` / `# nosec
        ##      B324` plus a one-line justification -- NEVER by a blanket
        ##      -s skip, which would blind every consumer to real weak
        ##      hashing. 1.6.2's hashlib_new (B324) plugin additionally
        ##      raises an internal error on a non-literal hashlib.new()
        ##      arg (logged, exit 0); `# nosec B324` silences that noise.
        ##      WAIVER PLACEMENT: 1.6.2 ignores the `# nosec` test id and
        ##      skips the WHOLE AST node (every check on it). The skip is
        ##      keyed to the line where the node STARTS, so a `# nosec` on
        ##      the opening line of a MULTILINE call masks sinks on its
        ##      continuation lines too. Put it only on a single, self-
        ##      contained line whose call is JUST the waived hash -- never
        ##      the opening line of a multiline call, and never a line also
        ##      carrying shell=True / eval / another sink, or that
        ##      high-severity finding is masked too. High-severity checks
        ##      (shell=True, eval, ...) fail the gate UNLESS co-located on
        ##      a waived line; keep waived lines minimal.
        ## --   end of options (defensive; file list may begin
        ##      with names like './-foo.py' that would otherwise
        ##      be parsed as options).
        ##
        ## --no-run-if-empty: bandit exits 0 with no files (the
        ## "no Python in this repo" case).
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          .github/dist-ai/ci/bandit-discover-python.sh \
            | xargs -0 --no-run-if-empty -- bandit -ll -ii --

      - name: Emit step summary
        if: always()
        ## Route values through env and consume with shell-native
        ## expansion inside run: to avoid expression interpolation
        ## in shell arguments (CodeQL js/actions/command-injection).
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'bandit' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "severity=medium" \
            --row "confidence=medium" \
            --row "weak-hash=B303,B324 gated (non-security digests waived per-site via # nosec)" \
            --row "discovery=.py extension + shebang scan"
